name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Each check runs even when an earlier one failed, so a formatting nit
      # cannot mask a broken test or build the way it did before.
      - name: Lint
        run: pnpm lint
      - name: Format check
        if: ${{ !cancelled() }}
        run: pnpm format:check
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm test
      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

  # The e2e suite drives the real engine in mock-LLM mode, so it needs the
  # sibling repo checked out where playwright.config.ts expects it.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: openswindle-web
      - uses: actions/checkout@v7
        with:
          repository: arkanine1000/openswindle
          path: openswindle
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: openswindle-web/pnpm-lock.yaml
      - name: Install uv
        # Pinned to a full version: setup-uv dropped its major/minor tags in
        # v7, so there is no @v9 to float on.
        uses: astral-sh/setup-uv@v9.0.0
      - name: Sync engine dependencies
        run: uv sync --locked
        working-directory: openswindle
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: openswindle-web
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: openswindle-web
      - name: End-to-end tests
        run: pnpm e2e
        working-directory: openswindle-web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: openswindle-web/test-results/
          retention-days: 7
